name: Sync publications

on:
  schedule:
    - cron: "0 1 * * 1"   # every Monday 01:00 UTC (09:00 Beijing)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "config.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull ORCID and OpenAlex records
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "homepage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sync publications $(date -u +%F)" -m "$(cat .sync-summary.md)"
          git push
