<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shikun Chen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shikun Chen: expensive multi-objective optimization, language models for optimization, scientific machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one quiet reading column; a Pareto front strip under the name is the only figure. Years sit in a mono gutter beside publications. */
:root {
  --bg: #fbfcff;
  --surface: #ffffff;
  --ink: #10162f;
  --muted: #56607d;
  --rule: #e2e6f3;
  --accent: #2b59ff;
  --accent-soft: #e7ecff;
  --dominated: #bcc4dd;
  --thumb-bg: #f2f5ff;
  --c0: #2b59ff;
  --c1: #8a3ffc;
  --c2: #00a19b;
  --c3: #ff6a2b;
  --c4: #e8368f;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure: 46rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f22; --surface: #121a36; --ink: #eef1ff; --muted: #9ba6c8;
    --rule: #242e52; --accent: #7d9bff; --accent-soft: #1b2658; --dominated: #34406c; --thumb-bg: #111a3a;
    --c0: #7d9bff; --c1: #b38bff; --c2: #34d8cc; --c3: #ff9a62; --c4: #ff73b6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f22; --surface: #121a36; --ink: #eef1ff; --muted: #9ba6c8;
  --rule: #242e52; --accent: #7d9bff; --accent-soft: #1b2658; --dominated: #34406c; --thumb-bg: #111a3a;
  --c0: #7d9bff; --c1: #b38bff; --c2: #34d8cc; --c3: #ff9a62; --c4: #ff73b6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; color: var(--ink);
  background:
    radial-gradient(48rem 26rem at 12% -6rem, color-mix(in srgb, var(--c0) 18%, transparent), transparent 70%),
    radial-gradient(42rem 24rem at 92% -4rem, color-mix(in srgb, var(--c1) 15%, transparent), transparent 70%),
    radial-gradient(36rem 20rem at 55% 16rem, color-mix(in srgb, var(--c2) 9%, transparent), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  font: 400 1rem/1.65 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.wrap {
  max-width: var(--measure); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4.5rem 3rem;
  display: grid; gap: 4rem;
}

/* Header */
.head { display: grid; gap: 1.25rem; position: relative; }
.lang {
  position: absolute; top: 0; right: 0; font: 500 0.78rem/1 var(--font-body); color: var(--muted);
  background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 0.45rem 0.8rem; cursor: pointer;
}
.lang:hover { color: var(--accent); border-color: var(--accent); }
.name { padding-right: 4.5rem; }
:lang(zh-CN) .bio { font-family: var(--font-body); font-size: 1.12rem; line-height: 1.85; }
.name {
  font: 400 clamp(2.6rem, 7vw, 3.75rem)/1.02 var(--font-display);
  letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
.name .native { font-size: 0.55em; color: var(--muted); margin-left: 0.4em; letter-spacing: 0; }
.role { margin: 0; color: var(--muted); font-size: 1.05rem; }
.role strong { color: var(--ink); font-weight: 500; }
.links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.95rem; }
.metrics {
  display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem;
  font: 400 0.8rem/1.4 var(--font-mono); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.metrics b { color: var(--accent); font-weight: 600; }
.metrics .src { opacity: 0.75; }

.front { position: relative; margin-top: 0.5rem; }
.front canvas { display: block; width: 100%; height: 150px; }
.front figcaption {
  display: flex; justify-content: space-between; gap: 1rem;
  font: 400 0.72rem/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.02em;
  border-top: 1px solid var(--rule); padding-top: 0.4rem;
}
.front .key { display: inline-flex; align-items: center; gap: 0.4rem; }
.front .dot { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(90deg, var(--c0), var(--c1)); display: inline-block; }

/* Sections */
section { display: grid; gap: 1.25rem; }
h2 {
  margin: 0; font: 500 0.75rem/1 var(--font-mono); text-transform: uppercase;
  letter-spacing: 0.14em; color: var(--muted);
  display: flex; align-items: baseline; gap: 0.75rem;
}
h2 .count { color: var(--accent); letter-spacing: 0.04em; }
.bio { margin: 0; font: 400 1.3rem/1.55 var(--font-display); max-width: 38rem; text-wrap: pretty; }

.themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 2rem; }
.theme {
  display: grid; gap: 0.35rem; align-content: start; padding: 1rem 1.1rem; border-radius: 10px;
  background: color-mix(in srgb, var(--tc) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 18%, transparent);
}
.theme h3 { margin: 0; font: 600 1rem/1.35 var(--font-body); color: color-mix(in srgb, var(--tc) 70%, var(--ink)); display: flex; gap: 0.5rem; align-items: baseline; }
.theme h3::before { content: ""; width: 0.6rem; height: 0.6rem; border-radius: 2px; background: var(--tc); flex: none; transform: translateY(-0.05rem); }
.theme p { margin: 0; color: var(--muted); font-size: 0.93rem; }
.theme .n { font: 500 0.75rem var(--font-mono); color: var(--tc); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  font: 400 0.8rem/1 var(--font-body); color: var(--muted);
  background: transparent; border: 1px solid var(--rule); border-radius: 999px;
  padding: 0.45rem 0.8rem; cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip { --tc: var(--accent); }
.chip:hover { color: var(--tc); border-color: var(--tc); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--tc) 14%, var(--surface)); color: color-mix(in srgb, var(--tc) 80%, var(--ink)); border-color: color-mix(in srgb, var(--tc) 35%, transparent); font-weight: 500; }

/* Publications */
.year-group { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0 1rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
.year { font: 500 0.85rem/1.6 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.15rem; }
.pub { display: grid; gap: 0.15rem; }
.pub-title { font: 500 1rem/1.45 var(--font-body); margin: 0; text-wrap: pretty; }
.pub-title a { color: var(--ink); text-decoration: none; }
.pub-title a:hover { color: var(--accent); text-decoration: underline; }
.authors { margin: 0; color: var(--muted); font-size: 0.9rem; }
.authors .me { color: var(--ink); font-weight: 600; }
.meta { margin: 0; font-size: 0.88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; align-items: baseline; }
.venue { font-family: var(--font-display); font-style: italic; font-size: 1rem; color: var(--ink); }
.tag { font: 400 0.7rem/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.cites { font: 400 0.75rem var(--font-mono); font-variant-numeric: tabular-nums; }
.new { font: 500 0.68rem/1 var(--font-mono); color: #fff; background: var(--c3); padding: 0.2rem 0.4rem; border-radius: 3px; letter-spacing: 0.06em; }

/* Reviews and projects */
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.rows .j { font-family: var(--font-display); font-size: 1.05rem; min-width: 0; }
.rows .y { font: 400 0.78rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .sub { display: block; font: 400 0.85rem var(--font-body); color: var(--muted); }
.empty { margin: 0; color: var(--muted); font-size: 0.93rem; }

/* Tabs: Home and CV share the header; the hash (#cv) picks the view so the CV has its own link. */
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--rule); margin-top: -2.5rem; }
.tab {
  font: 500 0.8rem/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  text-decoration: none; padding: 0.8rem 0.9rem 0.75rem; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.view { display: grid; gap: 4rem; }

/* CV timeline: dates in a mono gutter, entries joined by a thin rail */
.cv-list { list-style: none; margin: 0; padding: 0; display: grid; }
.cv-item { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0 1.25rem; padding: 0.9rem 0; border-top: 1px solid var(--rule); }
.cv-date { font: 400 0.8rem/1.7 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cv-body { display: grid; gap: 0.1rem; min-width: 0; border-left: 2px solid var(--accent-soft); padding-left: 1rem; }
.cv-item.now .cv-body { border-left-color: var(--accent); }
.cv-title { margin: 0; font: 500 1rem/1.45 var(--font-body); }
.cv-org { margin: 0; font: 400 1.05rem/1.4 var(--font-display); }
.cv-detail { margin: 0; color: var(--muted); font-size: 0.9rem; }

footer { font: 400 0.75rem/1.6 var(--font-mono); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 1rem; }

/* Publication tools */
.pub-tools { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: end; justify-content: space-between; }
.search {
  flex: 1 1 16rem; min-width: 0; font: 400 0.95rem var(--font-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.8rem;
}
.search::placeholder { color: var(--muted); }
.years { display: flex; gap: 3px; align-items: end; height: 3.4rem; }
.ybar {
  position: relative; width: 1.6rem; height: 100%; padding: 0 0 1rem; border: 0; background: transparent;
  cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
}
.ybar:disabled { cursor: default; }
.ybar-fill { display: block; width: 100%; max-height: calc(100% - 0.9rem); background: var(--dominated); border-radius: 2px 2px 0 0; transition: background .15s; }
.ybar:hover:not(:disabled) .ybar-fill, .ybar[aria-pressed="true"] .ybar-fill { background: var(--accent); }
.ybar-y { position: absolute; bottom: 0; left: 0; right: 0; font: 400 0.68rem/1 var(--font-mono); color: var(--muted); text-align: center; }
.ybar-n { position: absolute; top: 0; left: 0; right: 0; font: 400 0.62rem/1 var(--font-mono); color: var(--muted); text-align: center; opacity: 0; }
.ybar:hover .ybar-n, .ybar[aria-pressed="true"] .ybar-n { opacity: 1; }

.pubs > li { min-width: 0; }
.pub { grid-template-columns: 7rem minmax(0, 1fr); gap: 1rem; align-items: start; }
.thumb { display: block; border-radius: 5px; overflow: hidden; background: var(--thumb-bg); aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--rule); transition: border-color .15s, transform .15s; }
.thumb canvas, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pub:hover .thumb { border-color: var(--tc, var(--accent)); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--tc, var(--accent)) 55%, transparent); transform: translateY(-1px); }
.pub-title a:hover { color: var(--tc, var(--accent)); }
.pub-body { display: grid; gap: 0.15rem; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
.act {
  font: 400 0.72rem/1 var(--font-mono); letter-spacing: 0.04em; color: var(--muted); text-decoration: none;
  background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 0.35rem 0.55rem; cursor: pointer;
}
.act:hover { color: var(--accent); border-color: var(--accent); }
.act.on { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.drawer { margin-top: 0.5rem; }
.abstract { margin: 0; font-size: 0.92rem; line-height: 1.6; color: var(--ink); max-width: 40rem; border-left: 2px solid var(--accent-soft); padding-left: 0.85rem; }
.bib { margin: 0; font: 400 0.75rem/1.5 var(--font-mono); background: var(--surface); border: 1px solid var(--rule); border-radius: 5px; padding: 0.7rem 0.85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast {
  position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font: 400 0.8rem var(--font-mono); background: var(--ink); color: var(--bg); padding: 0.55rem 0.9rem; border-radius: 5px; z-index: 20;
}
@media (prefers-reduced-motion: reduce) { .thumb, .ybar-fill { transition: none; } }

@media (max-width: 560px) {
  .pub { grid-template-columns: 4.75rem minmax(0, 1fr); gap: 0.75rem; }
  .years { width: 100%; }
  .ybar { flex: 1; width: auto; }
  .wrap { padding-block: 2.5rem 2rem; gap: 3rem; }
  .themes { grid-template-columns: minmax(0, 1fr); }
  .year-group { grid-template-columns: minmax(0, 1fr); gap: 0.6rem; }
  .bio { font-size: 1.15rem; }
  .front canvas { height: 110px; }
  .tabs { margin-top: -1.5rem; }
  .view { gap: 3rem; }
  .cv-item { grid-template-columns: minmax(0, 1fr); gap: 0.3rem; }
  .cv-body { padding-left: 0.85rem; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <button type="button" class="lang" id="lang-toggle" aria-label="切换到中文">中文</button>
    <h1 class="name" id="name">Shikun Chen</h1>
    <p class="role" id="role"></p>
    <nav class="links" id="links" aria-label="Profiles"></nav>
    <div class="metrics" id="metrics"></div>
    <figure class="front" aria-hidden="true">
      <canvas id="front"></canvas>
      <figcaption><span data-i18n="minimize">f₁ → minimize</span><span class="key"><span class="dot"></span><span data-i18n="front">non-dominated set</span></span></figcaption>
    </figure>
  </header>

  <nav class="tabs" aria-label="Pages">
    <a class="tab" href="#" id="tab-home" data-i18n="home">Publications</a>
    <a class="tab" href="#cv" id="tab-cv" data-i18n="cv">CV</a>
  </nav>

  <div class="view" id="view-home">
  <section id="about" aria-labelledby="about-h">
    <h2 id="about-h" data-i18n="about">About</h2>
    <p class="bio" id="bio"></p>
  </section>

  <section id="research" aria-labelledby="research-h">
    <h2 id="research-h" data-i18n="research">Research</h2>
    <div class="themes" id="themes"></div>
  </section>

  <section id="publications" aria-labelledby="pubs-h">
    <h2 id="pubs-h"><span data-i18n="publications">Publications</span> <span class="count" id="pub-count"></span></h2>
    <div class="pub-tools">
      <input type="search" id="pub-search" class="search" placeholder="Search titles, co-authors, venues" aria-label="Search publications" autocomplete="off">
      <div class="years" id="years" role="group" aria-label="Filter by year"></div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter publications"></div>
    <div id="pub-list"></div>
  </section>

  <section id="projects" aria-labelledby="proj-h" hidden>
    <h2 id="proj-h" data-i18n="projects">Projects</h2>
    <ul class="rows" id="proj-list"></ul>
  </section>

  <section id="service" aria-labelledby="rev-h">
    <h2 id="rev-h"><span data-i18n="review">Peer review</span> <span class="count" id="rev-count"></span></h2>
    <ul class="rows" id="rev-list"></ul>
  </section>
  </div>

  <div class="view" id="view-cv" hidden>
    <section aria-labelledby="edu-h">
      <h2 id="edu-h" data-i18n="education">Education</h2>
      <ol class="cv-list" id="cv-education"></ol>
    </section>
    <section aria-labelledby="exp-h">
      <h2 id="exp-h" data-i18n="experience">Experience</h2>
      <ol class="cv-list" id="cv-experience"></ol>
    </section>
    <section aria-labelledby="hon-h" id="cv-honors-sec" hidden>
      <h2 id="hon-h" data-i18n="honors">Honors</h2>
      <ol class="cv-list" id="cv-honors"></ol>
    </section>
  </div>

  <footer id="footer"></footer>
  <div class="toast" id="toast" role="status" hidden></div>
</main>

<script>
(async function () {
  const get = (p) => fetch(p, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [profile, pubs, reviews, projects, metrics, cv] = await Promise.all([
    get("data/profile.json"), get("data/publications.json"), get("data/reviews.json"),
    get("data/projects.json"), get("data/metrics.json"), get("data/cv.json")
  ]);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* Language: English or Chinese. Paper titles, authors and venues stay in English. */
  const I18N = {
    en: {
      home: "Publications", cv: "CV", education: "Education", experience: "Experience", honors: "Honors",
      about: "About", research: "Research", publications: "Publications", projects: "Projects", review: "Peer review",
      pubsN: "publications", cites: "citations", via: "via", h: "h-index", papers: n => `${n} paper${n > 1 ? "s" : ""}`,
      all: "All", journal: "Journal", conference: "Conference", preprint: "Preprint",
      search: "Search titles, co-authors, venues", cited: n => `cited ${n}`, isNew: "NEW",
      abstract: "Abstract", code: "Code", none: "No publications match.", clear: "Clear filters",
      copied: "BibTeX copied", selected: "BibTeX selected, copy it from the box",
      reviews: (n, j) => `${n} reviews · ${j} journals`, now: "now",
      noReviews: "Verified reviewing activity appears here once it syncs from ORCID.",
      footer: d => `Publications and peer review sync weekly from ORCID and OpenAlex${d ? ` · last update ${d}` : ""}`,
      minimize: "f₁ → minimize", front: "non-dominated set", toggle: "中文", toggleLabel: "切换到中文"
    },
    zh: {
      home: "学术论文", cv: "简历", education: "教育经历", experience: "工作经历", honors: "荣誉",
      about: "简介", research: "研究方向", publications: "学术论文", projects: "科研项目", review: "审稿经历",
      pubsN: "篇论文", cites: "次引用", via: "来源", h: "h 指数", papers: n => `${n} 篇`,
      all: "全部", journal: "期刊", conference: "会议", preprint: "预印本",
      search: "搜索标题、合作者、期刊", cited: n => `被引 ${n}`, isNew: "新",
      abstract: "摘要", code: "代码", none: "没有符合条件的论文。", clear: "清除筛选",
      copied: "已复制 BibTeX", selected: "已选中 BibTeX，请手动复制",
      reviews: (n, j) => `${n} 次审稿 · ${j} 种期刊`, now: "至今",
      noReviews: "审稿记录将在与 ORCID 同步后显示。",
      footer: d => `论文与审稿记录每周自动从 ORCID 和 OpenAlex 同步${d ? ` · 最近更新 ${d}` : ""}`,
      minimize: "f₁ → 最小化", front: "非支配解集", toggle: "EN", toggleLabel: "Switch to English"
    }
  };
  let lang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
  try { lang = localStorage.getItem("lang") || lang; } catch (e) {}
  if (!I18N[lang]) lang = "en";
  const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === "function" ? v(...a) : v; };
  const pf = (o, f) => (lang === "zh" && o && o[f + "_zh"]) || (o && o[f]) || "";
  function applyStatic() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    $("pub-search").placeholder = t("search");
    $("lang-toggle").textContent = t("toggle");
    $("lang-toggle").setAttribute("aria-label", t("toggleLabel"));
  }

  /* Profile */
  function renderProfile() {
    if (!profile) return;
    $("name").innerHTML = esc(profile.name) + (profile.name_native ? `<span class="native">${esc(profile.name_native)}</span>` : "");
    document.title = profile.name;
    const roleBits = [pf(profile, "position") && `<strong>${esc(pf(profile, "position"))}</strong>`, esc(pf(profile, "affiliation")), esc(pf(profile, "location"))].filter(Boolean);
    $("role").innerHTML = roleBits.join(" · ");
    const links = (profile.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`);
    if (profile.email) links.push(`<span>${esc(profile.email)}</span>`);
    $("links").innerHTML = links.join("");
    $("bio").textContent = pf(profile, "bio");
  }

  const items = (pubs && pubs.items) || [];
  const selfNames = new Set(((profile && profile.self_names) || []).map(n => n.toLowerCase()));
  const themes = (profile && profile.themes) || [];
  const themeOf = (p) => themes.findIndex(t => t.keywords.some(k => p.title.toLowerCase().includes(k.toLowerCase())));

  /* Metrics and research themes with paper counts */
  function renderTop() {
    if (metrics) {
      $("metrics").innerHTML =
        `<span><b>${items.length}</b> ${t("pubsN")}</span>` +
        `<span><b>${metrics.citations}</b> ${t("cites")}</span>` +
        `<span>${t("h")} <b>${metrics.h_index}</b></span>` +
        (metrics.i10_index != null ? `<span>i10 <b>${metrics.i10_index}</b></span>` : "") +
        (metrics.source ? `<span class="src">${t("via")} ${esc(metrics.source)}</span>` : "");
    }
    $("themes").innerHTML = themes.map((th, i) => {
      const n = items.filter(p => themeOf(p) === i).length;
      return `<div class="theme" style="--tc: var(--c${i})"><h3>${esc(pf(th, "title"))}</h3><p>${esc(pf(th, "text"))}</p>${n ? `<span class="n">${t("papers", n)}</span>` : ""}</div>`;
    }).join("");
  }

  /* Publications */
  const filters = [{ key: "all" }, { key: "journal" }, { key: "conference" }].concat(themes.map((th, i) => ({ key: "t" + i })));
  const flabel = (f) => f.key[0] === "t" && f.key !== "t" ? pf(themes[Number(f.key.slice(1))], "title") : t(f.key);
  let active = "all", query = "", yearSel = null;
  try { active = localStorage.getItem("pubFilter") || "all"; } catch (e) {}
  if (!filters.some(f => f.key === active)) active = "all";
  const recent = Date.now() - 1000 * 60 * 60 * 24 * 60;
  const byKey = new Map(items.map((p, i) => [String(i), p]));
  items.forEach((p, i) => { p._k = String(i); });

  function authorsHtml(list) {
    const shown = list.length > 8 ? list.slice(0, 7).concat(["…", list[list.length - 1]]) : list;
    return shown.map(a => selfNames.has(a.toLowerCase()) ? `<span class="me">${esc(a)}</span>` : esc(a)).join(", ");
  }
  function bibtex(p) {
    const first = (p.authors && p.authors[0]) || "anon";
    const last = first.split(" ").pop().replace(/[^A-Za-z]/g, "").toLowerCase() || "anon";
    const word = (p.title.match(/[A-Za-z]{4,}/) || ["paper"])[0].toLowerCase();
    const kind = p.type === "conference" ? "inproceedings" : p.type === "preprint" ? "misc" : "article";
    const venueField = p.type === "conference" ? "booktitle" : p.type === "preprint" ? "howpublished" : "journal";
    const f = [["title", `{${p.title}}`], ["author", (p.authors || []).join(" and ")], [venueField, p.venue], ["year", p.year], ["doi", p.doi]]
      .filter(([, v]) => v).map(([k, v]) => `  ${k} = {${v}}`).join(",\n");
    return `@${kind}{${last}${p.year}${word},\n${f}\n}`;
  }
  function matches(p) {
    if (yearSel && p.year !== yearSel) return false;
    if (!(active === "all" ? true :
      active === "journal" || active === "conference" ? p.type === active :
      themeOf(p) === Number(active.slice(1)))) return false;
    if (!query) return true;
    const hay = [p.title, p.venue, (p.authors || []).join(" "), p.abstract || ""].join(" ").toLowerCase();
    return query.split(/\s+/).every(w => hay.includes(w));
  }
  function renderYears() {
    const counts = {};
    items.forEach(p => { counts[p.year] = (counts[p.year] || 0) + 1; });
    const ys = Object.keys(counts).map(Number);
    const lo = Math.min(...ys), hi = Math.max(...ys), max = Math.max(...Object.values(counts));
    const cols = [];
    for (let y = lo; y <= hi; y++) cols.push(y);
    $("years").innerHTML = cols.map(y => {
      const n = counts[y] || 0;
      return `<button type="button" class="ybar" id="y-${y}" data-y="${y}" ${n ? "" : "disabled"} aria-pressed="${yearSel === y}" aria-label="${y}: ${n} papers">
        <span class="ybar-fill" style="height:${Math.max(n ? 8 : 2, n / max * 100)}%"></span>
        <span class="ybar-n">${n || ""}</span><span class="ybar-y">${String(y).slice(2)}</span></button>`;
    }).join("");
  }
  function renderPubs() {
    const list = items.filter(matches);
    $("pub-count").textContent = list.length === items.length ? list.length : `${list.length} / ${items.length}`;
    $("filters").innerHTML = filters.map(f =>
      `<button type="button" class="chip" ${f.key[0] === "t" ? `style="--tc: var(--c${f.key.slice(1)})"` : ""} id="f-${f.key}" data-k="${f.key}" aria-pressed="${f.key === active}">${esc(flabel(f))}</button>`).join("");
    renderYears();
    const years = [...new Set(list.map(p => p.year))].sort((a, b) => b - a);
    $("pub-list").innerHTML = list.length ? years.map(y => {
      const ps = list.filter(p => p.year === y).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      return `<div class="year-group"><div class="year">${y}</div><ol class="pubs">${ps.map(p => `
        <li class="pub" data-k="${p._k}" style="--tc: var(--c${themeOf(p) < 0 ? 4 : themeOf(p)})">
          <a class="thumb" href="${esc(p.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${p.thumb
            ? `<img src="${esc(p.thumb)}" alt="" loading="lazy">`
            : `<canvas data-k="${p._k}"></canvas>`}</a>
          <div class="pub-body">
            <p class="pub-title"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></p>
            <p class="authors">${authorsHtml(p.authors || [])}</p>
            <p class="meta"><span class="venue">${esc(p.venue)}</span>
              <span class="tag">${["conference", "journal", "preprint"].includes(p.type) ? t(p.type) : esc(p.type)}</span>
              ${p.citations ? `<span class="cites">${t("cited", p.citations)}</span>` : ""}
              ${p.date && Date.parse(p.date) > recent ? `<span class="new">${t("isNew")}</span>` : ""}</p>
            <div class="actions">
              ${p.abstract ? `<button type="button" class="act" data-act="abs" aria-expanded="false">${t("abstract")}</button>` : ""}
              <button type="button" class="act" data-act="bib">BibTeX</button>
              ${p.code ? `<a class="act" href="${esc(p.code)}" target="_blank" rel="noopener">${t("code")}</a>` : ""}
              ${p.doi ? `<a class="act" href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">DOI</a>` : ""}
            </div>
            <div class="drawer" hidden></div>
          </div>
        </li>`).join("")}</ol></div>`;
    }).join("") : `<p class="empty">${t("none")} <button type="button" class="act" data-act="reset">${t("clear")}</button></p>`;
    document.querySelectorAll("#pub-list canvas[data-k]").forEach(c => drawThumb(c, byKey.get(c.dataset.k)));
  }
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    active = b.dataset.k;
    try { localStorage.setItem("pubFilter", active); } catch (err) {}
    renderPubs();
  });
  $("years").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-y]");
    if (!b) return;
    const y = Number(b.dataset.y);
    yearSel = yearSel === y ? null : y;
    renderPubs();
  });
  $("pub-search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); renderPubs(); });
  $("pub-list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "reset") {
      active = "all"; yearSel = null; query = ""; $("pub-search").value = ""; renderPubs(); return;
    }
    const li = b.closest(".pub"), p = byKey.get(li.dataset.k), drawer = li.querySelector(".drawer");
    if (b.dataset.act === "abs") {
      const open = drawer.hidden || drawer.dataset.mode !== "abs";
      drawer.dataset.mode = "abs";
      drawer.innerHTML = `<p class="abstract">${esc(p.abstract)}</p>`;
      drawer.hidden = !open;
      li.querySelectorAll(".act").forEach(x => x.classList.remove("on"));
      b.classList.toggle("on", open);
      b.setAttribute("aria-expanded", String(open));
    }
    if (b.dataset.act === "bib") {
      const text = bibtex(p);
      drawer.dataset.mode = "bib";
      drawer.innerHTML = `<pre class="bib">${esc(text)}</pre>`;
      drawer.hidden = false;
      li.querySelectorAll(".act").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      try { await navigator.clipboard.writeText(text); toast(t("copied")); }
      catch (err) {
        const r = document.createRange(); r.selectNodeContents(drawer.querySelector("pre"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        toast(t("selected"));
      }
    }
  });
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 1800);
  }

  /* Thumbnails: a small figure drawn from the paper's research theme, seeded by its DOI so each one differs.
     Put an image path in a paper's "thumb" field to use a real figure instead. */
  function drawThumb(cv, p) {
    const css = getComputedStyle(document.documentElement);
    const C = (n) => css.getPropertyValue(n).trim();
    const ti = themeOf(p), accent = C(`--c${ti < 0 ? 4 : ti}`), soft = C("--dominated"), ink = C("--muted"), bg = C("--thumb-bg");
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 112, h = cv.clientHeight || 84;
    cv.width = w * dpr; cv.height = h * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    let s = 0; for (const ch of (p.doi || p.title)) s = (s * 31 + ch.charCodeAt(0)) % 2147483647;
    const r = () => (s = (s * 16807 + 1) % 2147483647) / 2147483647;
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const t = (p.title || "").toLowerCase();
    let kind = themeOf(p);
    if (/lattice|cellular|homogeniz/.test(t)) kind = "lattice";
    else if (/defect|inspection|bushing|casting/.test(t)) kind = "defect";
    else if (/schedul/.test(t)) kind = "gantt";
    else if (/physics-informed|pde|sloshing|fractional|dynamical/.test(t)) kind = "field";
    else if (kind === 0) kind = "pareto";
    else if (kind === 1) kind = "gantt";
    else kind = "graph";
    g.lineWidth = 1;
    if (kind === "pareto") {
      const pts = Array.from({ length: 42 }, () => { const x = r(); return [x, Math.min(1, (1 - Math.sqrt(x)) + Math.pow(r(), 1.6) * 0.8)]; });
      const nd = pts.filter(a => !pts.some(b => b !== a && b[0] <= a[0] && b[1] <= a[1])).sort((a, b) => a[0] - b[0]);
      const X = x => 10 + x * (w - 20), Y = y => 10 + (1 - y) * (h - 20);
      g.fillStyle = soft; pts.forEach(([x, y]) => { g.beginPath(); g.arc(X(x), Y(y), 1.6, 0, 7); g.fill(); });
      g.strokeStyle = accent; g.beginPath();
      nd.forEach(([x, y], i) => { if (!i) g.moveTo(X(x), Y(y)); else { g.lineTo(X(x), Y(nd[i - 1][1])); g.lineTo(X(x), Y(y)); } });
      g.stroke(); g.fillStyle = accent; nd.forEach(([x, y]) => { g.beginPath(); g.arc(X(x), Y(y), 2.4, 0, 7); g.fill(); });
    } else if (kind === "gantt") {
      const rows = 5, rh = (h - 16) / rows;
      for (let i = 0; i < rows; i++) {
        let x = 8 + r() * 10;
        while (x < w - 14) {
          const len = 8 + r() * 26, hot = r() < 0.28;
          g.fillStyle = hot ? accent : soft;
          g.fillRect(x, 8 + i * rh + 2, Math.min(len, w - 8 - x), rh - 4);
          x += len + 2 + r() * 6;
        }
      }
    } else if (kind === "field") {
      const a = 2 + r() * 3, b = 2 + r() * 3, ph = r() * 6;
      g.strokeStyle = accent;
      for (let k = 0; k < 9; k++) {
        g.globalAlpha = 0.25 + 0.75 * (k / 8); g.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const y = h / 2 + (k - 4) * (h / 11) + Math.sin(x / w * a * Math.PI + ph + k * 0.35) * h * 0.08 * Math.cos(x / w * b);
          x ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
      g.globalAlpha = 1;
    } else if (kind === "lattice") {
      const n = 4 + Math.floor(r() * 2), cw = (w - 12) / n, ch2 = (h - 12) / 3;
      for (let i = 0; i < n; i++) for (let j = 0; j < 3; j++) {
        const x = 6 + i * cw, y = 6 + j * ch2, d = 0.15 + 0.85 * (i / (n - 1));
        g.strokeStyle = d > 0.6 ? accent : soft; g.lineWidth = 0.6 + d * 1.6;
        g.strokeRect(x, y, cw, ch2);
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + cw, y + ch2); g.moveTo(x + cw, y); g.lineTo(x, y + ch2); g.stroke();
      }
    } else if (kind === "defect") {
      for (let y = 4; y < h; y += 5) {
        g.strokeStyle = soft; g.globalAlpha = 0.35 + r() * 0.5; g.beginPath(); g.moveTo(0, y);
        for (let x = 0; x <= w; x += 6) g.lineTo(x, y + (r() - 0.5) * 2);
        g.stroke();
      }
      g.globalAlpha = 1;
      const bx = 18 + r() * (w - 60), by = 12 + r() * (h - 44), bw = 24 + r() * 14, bh = 16 + r() * 10;
      g.fillStyle = ink; g.beginPath(); g.ellipse(bx + bw / 2, by + bh / 2, bw / 4, bh / 5, r(), 0, 7); g.fill();
      g.strokeStyle = accent; g.lineWidth = 1.5; g.strokeRect(bx, by, bw, bh);
      g.fillStyle = accent; g.fillRect(bx, by - 7, 18, 7);
    } else {
      const nodes = Array.from({ length: 11 }, () => [10 + r() * (w - 20), 10 + r() * (h - 20)]);
      g.strokeStyle = soft;
      nodes.forEach((a, i) => nodes.slice(i + 1).forEach(b => { if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 38) { g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); } }));
      nodes.forEach((a, i) => { g.fillStyle = i < 3 ? accent : ink; g.beginPath(); g.arc(a[0], a[1], i < 3 ? 3 : 2, 0, 7); g.fill(); });
    }
  }
  const redrawThumbs = () => document.querySelectorAll("#pub-list canvas[data-k]").forEach(c => drawThumb(c, byKey.get(c.dataset.k)));
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawThumbs);
  new MutationObserver(redrawThumbs).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function renderRest() {
  /* Projects */
  const projItems = (projects && projects.items) || [];
  if (projItems.length) {
    $("projects").hidden = false;
    $("proj-list").innerHTML = projItems.map(p => `<li><span class="j">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}
      <span class="sub">${esc([p.role, p.funder, p.grant].filter(Boolean).join(" · "))}</span></span>
      <span class="y">${esc(p.start || "")}${p.end ? "–" + esc(p.end) : p.start ? "–" + t("now") : ""}</span></li>`).join("");
  }

  /* Peer review */
  const revItems = (reviews && reviews.items) || [];
  const totalReviews = revItems.reduce((s, r) => s + (r.count || 0), 0);
  $("rev-count").textContent = totalReviews ? t("reviews", totalReviews, revItems.length) : "";
  $("rev-list").outerHTML = revItems.length
    ? `<ul class="rows" id="rev-list">${revItems.map(r => `<li><span class="j">${esc(r.journal)}${r.publisher ? `<span class="sub">${esc(r.publisher)}</span>` : ""}</span>
        <span class="y">${r.count} × · ${esc(r.years)}</span></li>`).join("")}</ul>`
    : `<p class="empty" id="rev-list">${t("noReviews")}</p>`;

  const stamp = (pubs && pubs.updated) || "";
  $("footer").textContent = t("footer", stamp);
  }

  /* CV: education, experience and honors from data/cv.json (edited by hand, never touched by the sync) */
  function renderCV() {
    const row = (e) => {
      const date = e.single || e.start === e.end ? esc(e.start) : `${esc(e.start)} – ${e.end ? esc(e.end) : t("now")}`;
      const org = pf(e, "org"), detail = pf(e, "detail");
      return `<li class="cv-item${!e.end && !e.single ? " now" : ""}"><span class="cv-date">${date}</span><div class="cv-body">
        <p class="cv-title">${esc(pf(e, "title"))}</p>${org ? `<p class="cv-org">${esc(org)}</p>` : ""}${detail ? `<p class="cv-detail">${esc(detail)}</p>` : ""}</div></li>`;
    };
    $("cv-education").innerHTML = ((cv && cv.education) || []).map(row).join("");
    $("cv-experience").innerHTML = ((cv && cv.experience) || []).map(row).join("");
    const hon = (cv && cv.honors) || [];
    $("cv-honors-sec").hidden = !hon.length;
    $("cv-honors").innerHTML = hon.map(row).join("");
  }
  function route() {
    const onCV = location.hash === "#cv";
    $("view-home").hidden = onCV; $("view-cv").hidden = !onCV;
    $(onCV ? "tab-cv" : "tab-home").setAttribute("aria-current", "page");
    $(onCV ? "tab-home" : "tab-cv").removeAttribute("aria-current");
    if (!onCV) redrawThumbs();
  }
  window.addEventListener("hashchange", route);

  function renderAll() { applyStatic(); renderProfile(); renderTop(); renderPubs(); renderRest(); renderCV(); route(); }
  $("lang-toggle").addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    renderAll();
  });
  renderAll();
})();

/* Pareto front strip: a fixed sample of candidate solutions, the non-dominated ones joined by a staircase. */
(function () {
  const cv = document.getElementById("front");
  const ctx = cv.getContext("2d");
  let seed = 17;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pts = [];
  for (let i = 0; i < 150; i++) {
    const t = rnd();
    const front = 1 - Math.sqrt(t);
    const gap = Math.pow(rnd(), 1.8) * 0.9;
    pts.push({ x: t, y: Math.min(1, front + gap * (0.25 + rnd())) });
  }
  for (let i = 0; i < 14; i++) { const t = (i + 0.5) / 14; pts.push({ x: t, y: 1 - Math.sqrt(t) }); }
  const nd = pts.filter(p => !pts.some(q => q !== p && q.x <= p.x && q.y <= p.y && (q.x < p.x || q.y < p.y)))
    .sort((a, b) => a.x - b.x);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let progress = reduce ? 1 : 0;

  function draw() {
    const css = getComputedStyle(document.documentElement);
    const cv0 = css.getPropertyValue("--c0").trim(), cv1 = css.getPropertyValue("--c1").trim(), cv4 = css.getPropertyValue("--c4").trim();
    const dom = css.getPropertyValue("--dominated").trim();
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pad = 6;
    const X = (x) => pad + x * (w - pad * 2);
    const Y = (y) => pad + y * (h - pad * 2);
    ctx.fillStyle = dom;
    for (const p of pts) { ctx.beginPath(); ctx.arc(X(p.x), Y(1 - p.y), 2, 0, Math.PI * 2); ctx.fill(); }
    const upto = Math.max(1, Math.round(nd.length * progress));
    const accent = ctx.createLinearGradient(0, 0, w, 0);
    accent.addColorStop(0, cv0); accent.addColorStop(0.55, cv1); accent.addColorStop(1, cv4);
    ctx.strokeStyle = accent; ctx.lineWidth = 1.75; ctx.beginPath();
    nd.slice(0, upto).forEach((p, i) => {
      if (i === 0) ctx.moveTo(X(p.x), Y(1 - p.y));
      else { ctx.lineTo(X(p.x), Y(1 - nd[i - 1].y)); ctx.lineTo(X(p.x), Y(1 - p.y)); }
    });
    ctx.stroke();
    ctx.fillStyle = accent;
    for (const p of nd.slice(0, upto)) { ctx.beginPath(); ctx.arc(X(p.x), Y(1 - p.y), 3, 0, Math.PI * 2); ctx.fill(); }
  }
  function animate() {
    progress = Math.min(1, progress + 0.04);
    draw();
    if (progress < 1) requestAnimationFrame(animate);
  }
  draw();
  if (!reduce) requestAnimationFrame(animate);
  window.addEventListener("resize", draw);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
